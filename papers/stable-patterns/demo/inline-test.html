<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Stable patterns widget</title>
<style>
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; color: #262a30; background: #fff; }
main { max-width: 880px; margin: 40px auto; padding: 0 16px; }
</style>
</head>
<body>
<main>
<p>Text before the widget, in the page's column.</p>
<div id="demo"></div>
<p>Text after it.</p>
</main>
<script src="inline.js"></script>
<script>
const params = new URLSearchParams(location.search);
const main = document.querySelector('main');
if (params.get('width')) { main.style.maxWidth = 'none'; main.style.width = params.get('width') + 'px'; main.style.padding = '0'; main.style.margin = '20px'; }
window.demo = StablePatternsDemo.mount(document.getElementById('demo'), params.get('example') ? { example: params.get('example') } : {});
</script>
</body>
</html>
