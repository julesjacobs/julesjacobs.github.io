# Site settings
title: Notes by Jules Jacobs
email: julesjacobs@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Notes.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "http://julesjacobs.github.io" # the base hostname & protocol for your site
github_username: julesjacobs

# Build settings
markdown: kramdown

plugins:
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Working files that are kept in the repository but are not part of the site. (Setting this list replaces
# Jekyll's default one, so the defaults are repeated at its end.)
exclude:
  - sep.md
  - postideas.txt
  - structure.md
  - AGENTS.md
  - newpost.py
  - papers/stable-patterns/demo/inline-src
  - papers/stable-patterns/demo/inline-test.html
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
