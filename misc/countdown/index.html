<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POPL 2027 Submission Countdown</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #3b82f6 0%, #9333ea 100%);
      --card-bg: rgba(255, 255, 255, 0.1);
      --blur: 20px;
      --border: rgba(255, 255, 255, 0.3);
      /* Color mapping swapped: elapsed = muted, remaining = bright */
      --elapsed: rgba(255, 255, 255, 0.25);
      --remaining: #ffffff;
    }

    * {margin: 0;padding: 0;box-sizing: border-box;font-family: 'Inter', sans-serif;color: #fff;}
    html,body {height: 100%;width: 100%;}

    body {background: var(--bg-gradient);display: flex;align-items: center;justify-content: center;}

    .card {backdrop-filter: blur(var(--blur));background: var(--card-bg);border: 1px solid var(--border);padding: 3rem 4rem;border-radius: 2rem;text-align: center;box-shadow: 0 10px 25px rgba(0,0,0,0.25);max-width: 38rem;}

    h1 {font-size: 2rem;font-weight: 800;margin-bottom: 1rem;line-height: 1.3;}

    .timer {display:flex;gap:1.5rem;justify-content:center;margin-top:1rem;}
    .unit {display:flex;flex-direction:column;align-items:center;min-width:4.5rem;}
    .value {font-size:3rem;font-weight:800;letter-spacing:0.05em;}
    .label {font-size:0.85rem;font-weight:600;text-transform:uppercase;margin-top:0.25rem;letter-spacing:0.05em;}

    .year-bar {display:flex;flex-wrap:wrap;gap:2px;margin:auto;margin-top:2rem;justify-content:center; width:400px;}
    .day-block {width:12px;height:5px;border-radius:2px;background:var(--remaining);} /* default: remaining */

    footer {margin-top:2rem;font-size:0.8rem;font-weight:400;opacity:0.8;}
    .calendar-links { margin-top: 1rem; display: flex; justify-content: center; gap: 0.8rem; /* Adjusted gap */ }
    .calendar-links a { 
      opacity: 0.7; 
      transition: opacity 0.2s ease; 
      color: #fff; 
      text-decoration: none; 
      padding: 0.3rem; /* Add padding to increase clickable area */
      display: inline-flex; /* Ensure padding behaves correctly */
      align-items: center; /* Center icon vertically */
    }
    .calendar-links a:hover { opacity: 1; }
    .calendar-links i { font-size: 14px; /* Adjust size as needed */ }

    @media(max-width:500px){.card{padding:2rem;}.value{font-size:2.2rem;}}
  </style>
</head>
<body>
  <div class="card">
    <h1>POPL 2027<br>Submission Deadline</h1>
    <div class="timer" id="timer">
      <div class="unit"><span class="value" id="days">0</span><span class="label">Days</span></div>
      <div class="unit"><span class="value" id="hours">0</span><span class="label">Hours</span></div>
      <div class="unit"><span class="value" id="minutes">0</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="value" id="seconds">0</span><span class="label">Seconds</span></div>
    </div>

    <!-- Year progress bar -->
    <div class="year-bar" id="yearBar"></div>

    <footer>
      Counting down to 9 July 2026 23:59 AoE
      <div id="calendar-links" class="calendar-links">
        <a id="google-link" href="#" target="_blank" title="Add to Google Calendar"><i class="fa-brands fa-google" aria-hidden="true"></i></a>
        <a id="apple-link" href="#" target="_blank" title="Add to Apple Calendar"><i class="fa-brands fa-apple" aria-hidden="true"></i></a>
        <a id="outlook-link" href="#" target="_blank" title="Add to Outlook Calendar"><i class="fa-brands fa-microsoft" aria-hidden="true"></i></a>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      const deadline = new Date('2026-07-09T23:59:00-12:00');
      const title = 'POPL 2027 Submission Deadline'; // Define title here
      const yearDays = 365;
      const startDate = new Date(deadline);
      startDate.setDate(startDate.getDate() - (yearDays - 1));

      const els = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds'),
        bar: document.getElementById('yearBar')
      };

      // Build bar
      const blocks = [];
      for (let d = new Date(startDate); d <= deadline; d.setDate(d.getDate() + 1)) {
        const div = document.createElement('div');
        div.className = 'day-block';
        blocks.push({ date: new Date(d), el: div });
        els.bar.appendChild(div);
      }

      function pad(n) { return ('0' + n).slice(-2); }

      function update() {
        const now = new Date();
        const diff = Math.max(0, deadline - now);
        const s = Math.floor(diff / 1000);
        els.days.textContent    = Math.floor(s / 86400);
        els.hours.textContent   = pad(Math.floor((s % 86400) / 3600));
        els.minutes.textContent = pad(Math.floor((s % 3600) / 60));
        els.seconds.textContent = pad(s % 60);

        updateBar(now);
        if (diff <= 0) clearInterval(timer);
      }

      function updateBar(now) {
        const totalDurationMs = deadline - startDate;
        const elapsedMs = now - startDate;
        const remainingMs = Math.max(0, deadline - now);

        // Ensure valid calculations even if start/deadline is in the past/future relative to now
        const clampedElapsedMs = Math.max(0, Math.min(elapsedMs, totalDurationMs));

        // Calculate the overall progress fraction
        const overallProgressFraction = totalDurationMs > 0 ? clampedElapsedMs / totalDurationMs : (now >= deadline ? 1 : 0);

        // Calculate how many blocks should be fully elapsed based on overall progress
        const totalBlocks = blocks.length;
        const fullyElapsedBlocks = Math.floor(overallProgressFraction * totalBlocks);

        // Calculate the remaining fraction *within the current day* for the transition block
        const remainingTodayMs = remainingMs % 86400000;
        const remainingTodayFraction = remainingTodayMs / 86400000;
        // Percentage of the transition block that should be 'remaining' color
        const remainingPct = (remainingTodayFraction * 100).toFixed(2);
        // Percentage of the transition block that should be 'elapsed' color
        const elapsedPct = (100 - parseFloat(remainingPct)).toFixed(2);


        blocks.forEach(({ date, el }, index) => {
          if (index < fullyElapsedBlocks) {
            el.style.background = 'var(--elapsed)';
          } else if (index === fullyElapsedBlocks && now < deadline) {
            // This is the transition block
            el.style.background = `linear-gradient(90deg, var(--elapsed) ${elapsedPct}%, var(--remaining) ${elapsedPct}%)`;
          } else {
            // Blocks after the transition block (or all blocks if deadline passed)
            el.style.background = now >= deadline ? 'var(--elapsed)' : 'var(--remaining)';
          }
        });
      }

      update();
      const timer = setInterval(update, 1000);

      // Calculate calendar URLs and set hrefs
      const startTime = deadline;
      const endTime = new Date(startTime.getTime() + 3600000); // Add 1 hour
      const formatISODate = (d) => d.toISOString().replace(/-|:|\\.\\d\\d\\d/g, "");

      const googleCalendarUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${formatISODate(startTime)}/${formatISODate(endTime)}&details=${encodeURIComponent(title)}&location=&sf=true&output=xml`;

      const icsFileContent = `BEGIN:VCALENDAR\\nVERSION:2.0\\nBEGIN:VEVENT\\nDTSTART:${formatISODate(startTime)}\\nDTEND:${formatISODate(endTime)}\\nSUMMARY:${encodeURIComponent(title)}\\nEND:VEVENT\\nEND:VCALENDAR`;
      const appleCalendarUrl = `data:text/calendar;charset=utf8,${encodeURIComponent(icsFileContent)}`;

      const outlookCalendarUrl = `https://outlook.live.com/owa/?path=/calendar/action/compose&rru=addevent&subject=${encodeURIComponent(title)}&startdt=${startTime.toISOString()}&enddt=${endTime.toISOString()}`;

      document.getElementById('google-link').href = googleCalendarUrl;
      document.getElementById('apple-link').href = appleCalendarUrl;
      document.getElementById('outlook-link').href = outlookCalendarUrl;

    })();
  </script>
</body>
</html>
