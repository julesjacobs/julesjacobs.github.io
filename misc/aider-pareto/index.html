/* --------- helper: compute Pareto frontier --------- */
function pareto(data) {
  // Keep only rows with cost
  const valid = data.filter(r => r.cost !== null)
                    .sort((a,b) => a.cost - b.cost);
  const frontier = [];
  let bestAcc = -Infinity;
  for (const r of valid) {
    if (r.acc > bestAcc) { frontier.push(r); bestAcc = r.acc; }
  }
  // Build step-wise path
  const pathX = [frontier[0].cost], pathY = [frontier[0].acc];
  for (let i=1;i<frontier.length;i++){
    pathX.push(frontier[i].cost); pathY.push(frontier[i-1].acc);
    pathX.push(frontier[i].cost); pathY.push(frontier[i].acc);
  }
  return {frontier, pathX, pathY};
}

/* --------- helper: compute company-specific Pareto frontier --------- */
function companyPareto(data, company) {
  const companyData = data.filter(r => r.company === company);
  return pareto(companyData);
}

/* --------- colors by company --------- */
const palette = {
  "OpenAI":"#1f77b4", "Google":"#9467bd", "Anthropic":"#d62728",
  "DeepSeek":"#2ca02c", "xAI":"#17becf", "Alibaba":"#ff7f0e",
  "Mistral":"#e377c2", "01.AI":"#8c564b", "OpenRouter":"#bcbd22",
  "AllHands":"#7f7f7f", "Other":"#aaaaaa"
};
const companies = [...new Set(rows.map(r=>r.company))];

/* --------- prepare Plotly traces --------- */
const scatterTraces = companies.map(comp => {
  const pts = rows.filter(r=>r.company===comp);
  return {
    type:"scatter", mode:"markers",
    x: pts.map(p=>p.cost||500),   // put null-cost at 500 instead of 1000
    y: pts.map(p=>p.acc),
    text: pts.map(p=>`${p.model}<br>Cost: ${p.cost ?? "—"}<br>Acc: ${p.acc}%`),
    hovertemplate:"%{text}<extra></extra>",
    name: comp,
    marker:{
      color:palette[comp]||"#999", 
      size:9, 
      opacity: pts.map(p => p.cost ? 0.8 : 0.4) // Half opacity for unknown cost points
    },
    visible: true
  };
});

const {pathX, pathY, frontier} = pareto(rows);
const frontierTrace = {
  type:"scatter",
  mode:"lines",
  x:pathX, y:pathY,
  name:"Pareto frontier",
  line:{width:2, dash:"dash", color:"#555"},
  hoverinfo:"skip"
};

// Create vertical dotted lines from each Pareto frontier point to the top
const verticalLines = frontier.map(point => ({
  type:"scatter",
  mode:"lines",
  x:[point.cost, point.cost],
  y:[point.acc, point.acc + 10], // Go from the point to just below the label
  line:{width:1, dash:"dot", color:"#999"},
  showlegend:false,
  hoverinfo:"skip"
}));

// Create text annotations at the top for each Pareto frontier point
const annotations = frontier.map((point, i) => ({
  x: Math.log10(point.cost),
  y: point.acc + 10, // Fixed offset of 10 points above each frontier point
  text: `${point.model}<br>$${point.cost} | ${point.acc}%`,
  showarrow: false,
  font: {size: 11, color: palette[point.company] || "#333"},
  bgcolor: "rgba(255,255,255,0.9)",
  bordercolor: palette[point.company] || "#999",
  borderwidth: 1,
  xanchor: "center",
  yanchor: "bottom",
  xref: "x",
  yref: "y",
  textangle: 0 // Remove alternating angles since we won't have overlap
}));

const layout = {
  xaxis:{title:"Cost (USD, log scale)", type:"log"},
  yaxis:{title:"Accuracy (%)", range:[0,100]},
  legend:{orientation:"v"},
  margin:{l:60,r:20,t:60,b:60}, // Increased top margin for labels
  hovermode:"closest",
  annotations: annotations
};

// Create company-specific frontier trace (initially hidden)
const companyFrontierTrace = {
  type:"scatter",
  mode:"lines",
  x:[], y:[],
  name:"Company frontier",
  line:{width:3, dash:"solid", color:"red"},
  hoverinfo:"skip",
  visible:false,
  showlegend:false
};

// Create company-specific vertical lines (initially hidden)
const companyVerticalLines = [];
for (let i = 0; i < 10; i++) { // Create enough traces for potential frontier points
  companyVerticalLines.push({
    type:"scatter",
    mode:"lines",
    x:[], y:[],
    line:{width:1, dash:"dot", color:"#999"},
    showlegend:false,
    hoverinfo:"skip",
    visible:false
  });
}

// Create the plot
Plotly.newPlot("plot", [...scatterTraces, frontierTrace, ...verticalLines, companyFrontierTrace, ...companyVerticalLines], layout);

// Add hover event listeners
const plotDiv = document.getElementById('plot');

plotDiv.on('plotly_hover', function(data) {
  const point = data.points[0];
  if (point.data.name && point.data.name !== "Pareto frontier") {
    const company = point.data.name;
    const {pathX, pathY, frontier: companyFrontier} = companyPareto(rows, company);
    
    // Show company frontier line
    Plotly.restyle('plot', {
      x: [pathX],
      y: [pathY],
      visible: [true],
      'line.color': [palette[company] || "#999"]
    }, [scatterTraces.length + verticalLines.length + 1]);
    
    // Hide global vertical lines and show company vertical lines
    const globalVerticalIndices = [];
    for (let i = 0; i < verticalLines.length; i++) {
      globalVerticalIndices.push(scatterTraces.length + 1 + i);
    }
    Plotly.restyle('plot', {visible: false}, globalVerticalIndices);
    
    // Show company vertical lines
    const companyVerticalUpdates = companyFrontier.map((point, i) => ({
      x: [[point.cost, point.cost]],
      y: [[point.acc, point.acc + 10]],
      visible: [true]
    }));
    
    companyVerticalUpdates.forEach((update, i) => {
      if (i < companyVerticalLines.length) {
        Plotly.restyle('plot', update, [scatterTraces.length + verticalLines.length + 2 + i]);
      }
    });
    
    // Hide unused company vertical lines
    for (let i = companyFrontier.length; i < companyVerticalLines.length; i++) {
      Plotly.restyle('plot', {visible: [false]}, [scatterTraces.length + verticalLines.length + 2 + i]);
    }
    
    // Hide global frontier annotations and show company frontier annotations
    const companyAnnotations = companyFrontier.map((point, i) => ({
      x: Math.log10(point.cost),
      y: point.acc + 10,
      text: `${point.model}<br>$${point.cost} | ${point.acc}%`,
      showarrow: false,
      font: {size: 11, color: palette[point.company] || "#333"},
      bgcolor: "rgba(255,255,255,0.9)",
      bordercolor: palette[point.company] || "#999",
      borderwidth: 1,
      xanchor: "center",
      yanchor: "bottom",
      xref: "x",
      yref: "y",
      textangle: 0
    }));
    
    Plotly.relayout('plot', {
      annotations: companyAnnotations
    });
  }
});

plotDiv.on('plotly_unhover', function(data) {
  // Hide company frontier line
  Plotly.restyle('plot', {
    visible: [false]
  }, [scatterTraces.length + verticalLines.length + 1]);
  
  // Show global vertical lines
  const globalVerticalIndices = [];
  for (let i = 0; i < verticalLines.length; i++) {
    globalVerticalIndices.push(scatterTraces.length + 1 + i);
  }
  Plotly.restyle('plot', {visible: true}, globalVerticalIndices);
  
  // Hide all company vertical lines
  for (let i = 0; i < companyVerticalLines.length; i++) {
    Plotly.restyle('plot', {visible: [false]}, [scatterTraces.length + verticalLines.length + 2 + i]);
  }
  
  // Restore global frontier annotations
  Plotly.relayout('plot', {
    annotations: annotations
  });
});
</script>
