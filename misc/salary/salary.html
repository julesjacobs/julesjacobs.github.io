<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="info-pane">
            <ul class="rate-list">
                <li class="rate-item-year">Per Year: $<span id="rate-year" class="editable-rate" contenteditable="true">50000.00</span></li>
                <div class="rate-grid">
                    <li class="rate-item">Per Month: $<span id="rate-month" class="editable-rate" contenteditable="true">0.00</span></li>
                    <li class="rate-item">Per Week: $<span id="rate-week" class="editable-rate" contenteditable="true">0.00</span></li>
                    <li class="rate-item">Per Day: $<span id="rate-day" class="editable-rate" contenteditable="true">0.00</span></li>
                    <li class="rate-item">Per Hour: $<span id="rate-hour" class="editable-rate" contenteditable="true">0.00</span></li>
                    <li class="rate-item">Per Minute: $<span id="rate-minute" class="editable-rate" contenteditable="true">0.00</span></li>
                    <li class="rate-item">Per Second: $<span id="rate-second" class="editable-rate" contenteditable="true">0.00</span></li>
                </div>
            </ul>
        </div>

        <div class="ticker-section">
            <div class="ticker-value-wrapper">
                <span class="currency-symbol">$</span><span id="ticker">0.0000</span>
            </div>
        </div>

        <div class="spend-section">
            <div class="spend-input-group">
                <span class="currency-symbol">$</span>
                <input type="number" id="spend-amount" class="spend-input" placeholder="0" value="10">
                <button id="spend-button">Spend</button>
            </div>
            <p>Time to earn: <span id="time-to-earn">---</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
